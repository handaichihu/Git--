<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行中 · SVG Animation</title>
<style>
  :root{
    --ink:#123f45;
    --cream:#fff9ec;
    --coral:#e85d43;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, #3d7d78 0%, #17484c 48%, #0a2c31 100%);
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .stage{
    position:relative;
    width:min(94vw, calc(94vh * 10 / 7));
    aspect-ratio:10 / 7;
    border-radius:clamp(16px, 2.2vw, 30px);
    overflow:hidden;
    background:#b9dfe5;
    box-shadow:
      0 36px 90px rgba(1,20,23,.55),
      0 2px 0 rgba(255,255,255,.18) inset,
      0 0 0 1px rgba(255,255,255,.14);
  }
  svg{display:block;width:100%;height:100%}

  /* ---------- ambient motion ---------- */
  .cloud-a{animation:cloudDrift 28s ease-in-out infinite alternate}
  .cloud-b{animation:cloudDrift 38s ease-in-out infinite alternate-reverse}
  .cloud-c{animation:cloudDrift 46s ease-in-out infinite alternate}
  .cloud-d{animation:cloudDrift 33s ease-in-out infinite alternate-reverse}
  @keyframes cloudDrift{
    from{transform:translateX(-16px)}
    to{transform:translateX(24px)}
  }

  #sunRing{
    transform-box:fill-box;
    transform-origin:center;
    animation:sunPulse 6.5s ease-in-out infinite alternate;
  }
  @keyframes sunPulse{
    from{opacity:.16;transform:scale(.985)}
    to{opacity:.34;transform:scale(1.035)}
  }

  #rig{animation:rigBob 1.45s ease-in-out infinite}
  @keyframes rigBob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-2.6px)}
  }

  .road-dashes{
    animation:roadFlow .58s linear infinite;
  }
  @keyframes roadFlow{
    to{stroke-dashoffset:-76}
  }

  .chain-top{
    animation:chainForward .42s linear infinite;
  }
  .chain-bottom{
    animation:chainBackward .42s linear infinite;
  }
  @keyframes chainForward{
    to{stroke-dashoffset:-20}
  }
  @keyframes chainBackward{
    to{stroke-dashoffset:20}
  }

  .speed-line{
    opacity:0;
    animation:whoosh 1.9s linear infinite;
  }
  .speed-line:nth-child(2){animation-delay:-.55s}
  .speed-line:nth-child(3){animation-delay:-1.1s}
  .speed-line:nth-child(4){animation-delay:-1.5s}
  @keyframes whoosh{
    0%{opacity:0;transform:translateX(26px)}
    18%{opacity:.46}
    70%{opacity:.28}
    100%{opacity:0;transform:translateX(-52px)}
  }

  .dust{
    transform-box:fill-box;
    transform-origin:center;
    animation:dustPuff 1.45s ease-out infinite;
  }
  .dust:nth-child(2){animation-delay:-.45s}
  .dust:nth-child(3){animation-delay:-.9s}
  @keyframes dustPuff{
    0%{opacity:.55;transform:translate(0,0) scale(.45)}
    100%{opacity:0;transform:translate(-48px,-20px) scale(1.35)}
  }

  .tuft{
    transform-box:fill-box;
    transform-origin:bottom center;
    animation:sway 2.8s ease-in-out infinite alternate;
  }
  .tuft:nth-of-type(2){animation-delay:-1.1s}
  .tuft:nth-of-type(3){animation-delay:-1.9s}
  @keyframes sway{
    from{transform:rotate(-1.8deg)}
    to{transform:rotate(2.4deg)}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
    }
  }
</style>
</head>
<body>

<script>
(function () {
  const svg = document.getElementById('ride');
  const $ = (id) => document.getElementById(id);

  const BB = { x: 515, y: 527 };
  const CRANK_LENGTH = 36;
  const nearHip = { x: 474, y: 381 };
  const farHip  = { x: 451, y: 374 };
  const nearLengths = { upper: 102, lower: 122 };
  const farLengths  = { upper: 99,  lower: 119 };

  const rearSpinner = $('rearSpinner');
  const frontSpinner = $('frontSpinner');
  const chainring = $('chainring');
  const nearCrankArm = $('nearCrankArm');
  const farCrankArm = $('farCrankArm');
  const nearPedal = $('nearPedal');
  const farPedal = $('farPedal');

  function solveLeg(hip, foot, upper, lower) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const rawDistance = Math.hypot(dx, dy) || 0.001;
    const ux = dx / rawDistance;
    const uy = dy / rawDistance;

    const minReach = Math.abs(upper - lower) + 1;
    const maxReach = upper + lower - 0.5;
    const distance = Math.max(minReach, Math.min(maxReach, rawDistance));

    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));

    const midX = hip.x + ux * along;
    const midY = hip.y + uy * along;

    return {
      knee: { x: midX + uy * height, y: midY - ux * height },
      ankle: { x: hip.x + ux * distance, y: hip.y + uy * distance }
    };
  }

  function drawLeg(prefix, hip, pedalPoint, lengths) {
    const ankleTarget = { x: pedalPoint.x - 1, y: pedalPoint.y - 9 };
    const solved = solveLeg(hip, ankleTarget, lengths.upper, lengths.lower);
    const { knee, ankle } = solved;

    const pathData =
      'M' + hip.x.toFixed(2) + ' ' + hip.y.toFixed(2) +
      ' L' + knee.x.toFixed(2) + ' ' + knee.y.toFixed(2) +
      ' L' + ankle.x.toFixed(2) + ' ' + ankle.y.toFixed(2);

    $(prefix + 'LegOuter').setAttribute('d', pathData);
    $(prefix + 'LegInner').setAttribute('d', pathData);
    $(prefix + 'Foot').setAttribute(
      'transform',
      'translate(' + ankle.x.toFixed(2) + ' ' + ankle.y.toFixed(2) + ')'
    );
  }

  function updateRide(milliseconds) {
    const wheelAngle = (milliseconds * 0.5) % 360;
    rearSpinner.setAttribute('transform', 'translate(300 525) rotate(' + wheelAngle.toFixed(2) + ')');
    frontSpinner.setAttribute('transform', 'translate(718 525) rotate(' + wheelAngle.toFixed(2) + ')');

    const crankAngle = milliseconds * 0.006;
    const crankDegrees = (crankAngle * 180 / Math.PI) % 360;
    chainring.setAttribute('transform', 'translate(515 527) rotate(' + crankDegrees.toFixed(2) + ')');

    const nearPoint = {
      x: BB.x + Math.cos(crankAngle) * CRANK_LENGTH,
      y: BB.y + Math.sin(crankAngle) * CRANK_LENGTH
    };
    const farPoint = {
      x: BB.x + Math.cos(crankAngle + Math.PI) * CRANK_LENGTH,
      y: BB.y + Math.sin(crankAngle + Math.PI) * CRANK_LENGTH
    };

    nearCrankArm.setAttribute('x2', nearPoint.x.toFixed(2));
    nearCrankArm.setAttribute('y2', nearPoint.y.toFixed(2));
    nearPedal.setAttribute('transform', 'translate(' + nearPoint.x.toFixed(2) + ' ' + nearPoint.y.toFixed(2) + ')');

    farCrankArm.setAttribute('x2', farPoint.x.toFixed(2));
    farCrankArm.setAttribute('y2', farPoint.y.toFixed(2));
    farPedal.setAttribute('transform', 'translate(' + farPoint.x.toFixed(2) + ' ' + farPoint.y.toFixed(2) + ')');

    drawLeg('near', nearHip, nearPoint, nearLengths);
    drawLeg('far', farHip, farPoint, farLengths);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  if (reduceMotion.matches) {
    updateRide(840);
    if (typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
  } else {
    let start = null;
    function tick(now) {
      if (start === null) start = now;
      updateRide(now - start);
      window.requestAnimationFrame(tick);
    }
    window.requestAnimationFrame(tick);
  }
})();
</script>
