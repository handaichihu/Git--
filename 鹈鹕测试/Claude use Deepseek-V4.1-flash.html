<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#7ec8f2, #bfe6fb 55%, #dff3ff);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .stage { width: min(100vw, 112vh, 1280px); line-height: 0; }
  svg { display: block; width: 100%; height: auto; cursor: pointer;
        border-radius: 10px; box-shadow: 0 18px 50px -20px rgba(20,40,60,.45); }

  /* 云 */
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  .cloud { fill: #fff; opacity: .88; animation: drift 34s linear infinite; }

  /* 远处树林（视差慢层） */
  @keyframes laneFar { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  .laneFar { animation: laneFar 1.6s linear infinite; }

  /* 路边灌木（与地面同速） */
  @keyframes laneNear { from { transform: translateX(0); } to { transform: translateX(-260px); } }
  .laneNear { animation: laneNear .55s linear infinite; }

  /* 路面虚线 */
  @keyframes dashRun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 260; } }
  .roadDash { animation: dashRun .55s linear infinite; }

  /* 速度线 */
  @keyframes zip {
    0%   { transform: translateX(90px); opacity: 0; }
    18%  { opacity: .85; }
    100% { transform: translateX(-340px); opacity: 0; }
  }
  .zip { animation: zip 1.1s linear infinite; }

  /* 后轮扬尘 */
  @keyframes puff {
    0%   { transform: translate(0,0) scale(.35); opacity: 0; }
    22%  { opacity: .5; }
    100% { transform: translate(-95px,-42px) scale(1.5); opacity: 0; }
  }
  .puff { transform-box: fill-box; transform-origin: center;
          animation: puff 1s linear infinite; }

  /* 翅膀轻拍 / 围巾飞舞（绕指定关节点旋转） */
  @keyframes flap { 0%,100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.6deg); } }
  #wingNear { transform-box: view-box; transform-origin: 364px 222px;
              animation: flap .9s ease-in-out infinite; }
  @keyframes flutter { 0%,100% { transform: rotate(-6deg) skewY(0deg); } 50% { transform: rotate(5deg) skewY(-5deg); } }
  #scarfTail { transform-box: view-box; transform-origin: 394px 192px;
               animation: flutter .55s ease-in-out infinite; }

  /* 小鸟振翅 */
  @keyframes birdFlap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
  .bird { transform-box: view-box; transform-origin: 0 0; animation: birdFlap 1.4s ease-in-out infinite; }

  /* 暂停 */
  svg.paused * { animation-play-state: paused !important; }
</style>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $  = id => document.getElementById(id);

/* ---------- 车轮辐条 ---------- */
function buildSpokes(g, cx, cy, rIn, rOut, n) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (cx + Math.cos(a) * rIn).toFixed(1));
    l.setAttribute('y1', (cy + Math.sin(a) * rIn).toFixed(1));
    l.setAttribute('x2', (cx + Math.cos(a) * rOut).toFixed(1));
    l.setAttribute('y2', (cy + Math.sin(a) * rOut).toFixed(1));
    g.appendChild(l);
  }
}
buildSpokes($('rearSpokes'),  300, 380, 6, 44, 14);
buildSpokes($('frontSpokes'), 500, 380, 6, 44, 14);

/* ---------- 几何参数 ---------- */
const BB  = { x: 400, y: 382 };   // 五通（曲柄轴）
const RCR = 22;                    // 曲柄长度
const HIP = { x: 372, y: 282 };    // 髋关节
const L1  = 60, L2 = 68;           // 大腿 / 小腿长度

const CRANK_PERIOD = 1.2;          // 踩一圈的秒数
const GEAR         = 1.7;          // 后轮转速 / 曲柄转速

const el = {
  crankNear: $('crankNear'), crankFar: $('crankFar'),
  rearWheel: $('rearWheel'), frontWheel: $('frontWheel'),
  pedalNear: $('pedalNear'), pedalFar: $('pedalFar'),
  rider: $('rider'), riderFar: $('riderFar'), head: $('headGroup'),
  legs: [
    { thigh: $('thighFar'),  shin: $('shinFar'),  foot: $('footFar'),  off: [-7, -3], phase: Math.PI },
    { thigh: $('thighNear'), shin: $('shinNear'), foot: $('footNear'), off: [ 3,  3], phase: 0 }
  ]
};

const rad = d => d * Math.PI / 180;

/* 踏板位置：曲柄角 -> 坐标 */
function pedalAt(deg) {
  return { x: BB.x + RCR * Math.cos(rad(deg)), y: BB.y + RCR * Math.sin(rad(deg)) };
}

/* 两骨骼 IK：给定髋、踝求膝盖（膝向 +x 方向弯曲） */
function solveIK(hip, ankle, l1, l2) {
  let dx = ankle.x - hip.x, dy = ankle.y - hip.y;
  let d  = Math.hypot(dx, dy) || 0.001;
  const maxD = (l1 + l2) * 0.999, minD = Math.abs(l1 - l2) + 0.001;
  const clamp = Math.min(Math.max(d, minD), maxD);
  dx *= clamp / d; dy *= clamp / d; d = clamp;

  const ux = dx / d, uy = dy / d;
  const a  = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h  = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
}

function setLeg(leg, hip, ankle) {
  const k = solveIK(hip, ankle, L1, L2);
  leg.thigh.setAttribute('x1', hip.x);   leg.thigh.setAttribute('y1', hip.y);
  leg.thigh.setAttribute('x2', k.x);     leg.thigh.setAttribute('y2', k.y);
  leg.shin.setAttribute('x1', k.x);      leg.shin.setAttribute('y1', k.y);
  leg.shin.setAttribute('x2', ankle.x);  leg.shin.setAttribute('y2', ankle.y);
  leg.foot.setAttribute('transform', `translate(${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)})`);
}

/* ---------- 主动画循环 ---------- */
let crankDeg = 0, wheelDeg = 0, last = performance.now(), paused = false;

function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!paused) {
    crankDeg = (crankDeg + dt / CRANK_PERIOD * 360) % 360;
    wheelDeg = (wheelDeg + dt / CRANK_PERIOD * GEAR * 360) % 360;
  }

  // 车轮 & 曲柄
  el.rearWheel.setAttribute('transform',  `rotate(${wheelDeg.toFixed(2)} 300 380)`);
  el.frontWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 500 380)`);
  el.crankNear.setAttribute('transform',  `rotate(${crankDeg.toFixed(2)} ${BB.x} ${BB.y})`);
  el.crankFar.setAttribute('transform',   `rotate(${crankDeg.toFixed(2)} ${BB.x} ${BB.y})`);

  // 身体随踩踏上下起伏
  const bob = 2.6 * Math.sin(rad(crankDeg * 2));
  el.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  el.riderFar.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  el.head.setAttribute('transform',
    `rotate(${(1.6 * Math.sin(rad(crankDeg))).toFixed(2)} 415 200)`);

  // 踏板 + 双腿
  const pNear = pedalAt(crankDeg), pFar = pedalAt(crankDeg + 180);
  el.pedalNear.setAttribute('transform', `translate(${pNear.x.toFixed(1)} ${pNear.y.toFixed(1)})`);
  el.pedalFar.setAttribute('transform',  `translate(${pFar.x.toFixed(1)} ${pFar.y.toFixed(1)})`);

  for (const leg of el.legs) {
    const p = leg.phase === 0 ? pNear : pFar;
    setLeg(leg,
      { x: HIP.x + leg.off[0], y: HIP.y + leg.off[1] + bob },
      { x: p.x, y: p.y - 7 });
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* 点击暂停 / 继续 */
$('scene').addEventListener('click', () => {
  paused = !paused;
  $('scene').classList.toggle('paused', paused);
});
</script>
