<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html,body{margin:0;height:100%;background:#0b1017;display:grid;place-items:center;
    overflow:hidden;font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{width:min(97vw,1060px)}
  svg{width:100%;height:auto;display:block;border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .cloud{animation:drift 26s linear infinite}
  .c1{animation-duration:29s;animation-delay:-13s}
  .c2{animation-duration:36s;animation-delay:-26s}
  .c3{animation-duration:32s;animation-delay:-21s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1240px)}}
  .speed{animation:zip 1.5s linear infinite}
  .s2{animation-delay:-.5s}
  .s3{animation-delay:-1s}
  .s4{animation-delay:-.25s}
  @keyframes zip{0%{transform:translateX(24px);opacity:0}
    25%{opacity:.7}100%{transform:translateX(-150px);opacity:0}}
</style>
