<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #23234a, #12122a 70%);
    font-family: sans-serif;
  }
  svg {
    width: min(96vw, 1100px);
    height: auto;
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,.55);
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8ecae6"/>
      <stop offset="70%" stop-color="#cdeafc"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb95f"/>
      <stop offset="100%" stop-color="#5d9a46"/>
    </linearGradient>

    <style>
      /* ---------- 轮子：整圈旋转（SMIL，与腿部同时间轴；CSS 仅装饰性动画） ---------- */

      /* ---------- 骑手上下起伏 / 点头 / 翅膀扇动 ---------- */
      @keyframes bob  { from { transform: translateY(0); }   to { transform: translateY(-5px); } }
      @keyframes nod  { from { transform: rotate(-2deg); }   to { transform: rotate(3deg); } }
      @keyframes flap { from { transform: rotate(9deg); }    to { transform: rotate(-15deg); } }
      @keyframes sway { from { transform: rotate(-0.6deg); } to { transform: rotate(0.6deg); } }
      .rider { animation: none; }
      .head  { transform-origin: 428px 110px; animation: nod 0.45s ease-in-out infinite alternate; }
      .wing  { transform-origin: 322px 122px; animation: flap 0.45s ease-in-out infinite alternate; }
      .bike-scene { transform-origin: 380px 265px; animation: sway 0.9s ease-in-out infinite alternate; }

      /* ---------- 云飘过（视差） ---------- */
      @keyframes drift { to { transform: translateX(-1300px); } }
      .cloud { animation: drift 26s linear infinite; }
      .cloud.c2 { animation-duration: 20s; animation-delay: -11s; }
      .cloud.c3 { animation-duration: 32s; animation-delay: -19s; }

      /* ---------- 路面虚线后退 + 速度线 ---------- */
      @keyframes dashmove { to { stroke-dashoffset: 70; } }
      .roadline { animation: dashmove 0.45s linear infinite; }
      @keyframes whoosh { 0% { transform: translateX(40px); opacity: 0; }
                          20% { opacity: .8; }
                          100% { transform: translateX(-140px); opacity: 0; } }
      .streak { animation: whoosh 1.1s linear infinite; }
      .streak.s2 { animation-delay: -0.35s; }
      .streak.s3 { animation-delay: -0.7s; }
    </style>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="705" cy="62" r="34" fill="#ffd23f" stroke="#ffbe0b" stroke-width="4"/>
  <g stroke="#ffd23f" stroke-width="4" stroke-linecap="round">
    <line x1="705" y1="12" x2="705" y2="2"/>   <line x1="705" y1="112" x2="705" y2="122"/>
    <line x1="655" y1="62" x2="645" y2="62"/>  <line x1="755" y1="62" x2="765" y2="62"/>
    <line x1="670" y1="27" x2="663" y2="20"/>  <line x1="740" y1="97" x2="747" y2="104"/>
    <line x1="740" y1="27" x2="747" y2="20"/>  <line x1="670" y1="97" x2="663" y2="104"/>
  </g>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.9">
    <g class="cloud c1"><ellipse cx="180" cy="72" rx="46" ry="18"/><circle cx="160" cy="62" r="20"/><circle cx="192" cy="56" r="24"/></g>
    <g class="cloud c2"><ellipse cx="430" cy="118" rx="38" ry="14"/><circle cx="414" cy="108" r="16"/><circle cx="444" cy="104" r="19"/></g>
    <g class="cloud c3"><ellipse cx="640" cy="150" rx="30" ry="11"/><circle cx="632" cy="142" r="13"/><circle cx="655" cy="140" r="15"/></g>
  </g>

  <!-- 远处小山 -->
  <ellipse cx="150" cy="322" rx="180" ry="46" fill="#a8d5a2"/>
  <ellipse cx="620" cy="326" rx="230" ry="58" fill="#96c98f"/>

  <!-- 草地与马路 -->
  <rect x="0" y="318" width="800" height="82" fill="url(#grass)"/>
  <rect x="0" y="330" width="800" height="42" fill="#6b6f76"/>
  <rect x="0" y="328" width="800" height="4"  fill="#8a8f96"/>
  <line class="roadline" x1="0" y1="351" x2="800" y2="351"
        stroke="#f4f1ca" stroke-width="5" stroke-dasharray="40 30"/>

  <!-- ============ 自行车 + 鹈鹕 ============ -->
  <g transform="translate(0,8)">
  <g class="bike-scene">

    <!-- 后轮 -->
    <g class="wheel-rear">
      <animateTransform attributeName="transform" type="rotate"
        values="0 280 265; 360 280 265" dur="0.9s" repeatCount="indefinite"/>
      <circle cx="280" cy="265" r="55" fill="none" stroke="#222" stroke-width="8"/>
      <circle cx="280" cy="265" r="47" fill="none" stroke="#d7dbe0" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="3">
        <line x1="236" y1="265" x2="324" y2="265"/>
        <line x1="280" y1="221" x2="280" y2="309"/>
        <line x1="249" y1="234" x2="311" y2="296"/>
        <line x1="249" y1="296" x2="311" y2="234"/>
      </g>
      <circle cx="280" cy="265" r="7" fill="#555"/>
    </g>

    <!-- 远侧腿（被车架遮挡；IK 求解，脚严格跟随踏板圆周，相位差180°） -->
    <path d="M342,176 L367.9,218.8 L355,265" fill="none" stroke="#d97b29" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="M342,176 L367.9,218.8 L355.0,265.0;
                M342,176 L383.3,204.2 L362.3,247.3;
                M342,176 L389.1,192.9 L380.0,240.0;
                M342,176 L385.3,200.9 L397.7,247.3;
                M342,176 L376.3,212.4 L405.0,265.0;
                M342,176 L371.1,216.7 L397.7,282.7;
                M342,176 L364.3,220.8 L380.0,290.0;
                M342,176 L358.1,223.3 L362.3,282.7;
                M342,176 L367.9,218.8 L355.0,265.0"/>
    </path>

    <!-- 车架 -->
    <g stroke="#d62828" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="280" y1="265" x2="380" y2="265"/> <!-- 后下叉 -->
      <line x1="280" y1="265" x2="348" y2="182"/> <!-- 后上叉 -->
      <line x1="380" y1="265" x2="348" y2="182"/> <!-- 立管 -->
      <line x1="348" y1="182" x2="462" y2="168"/> <!-- 上管 -->
      <line x1="380" y1="265" x2="462" y2="168"/> <!-- 下管 -->
      <line x1="462" y1="168" x2="455" y2="208"/> <!-- 头管 -->
      <line x1="455" y1="208" x2="480" y2="265"/> <!-- 前叉 -->
    </g>
    <!-- 链条 -->
    <g stroke="#555" stroke-width="3" fill="none">
      <line x1="280" y1="259" x2="380" y2="251"/>
      <line x1="280" y1="271" x2="380" y2="279"/>
      <circle cx="280" cy="265" r="10" fill="none"/>
    </g>

    <!-- 曲柄 + 脚踏（SMIL 旋转，与腿部 IK 同一时间轴、严格同相位） -->
    <g class="crank">
      <animateTransform attributeName="transform" type="rotate"
        values="0 380 265; 90 380 265; 180 380 265; 270 380 265; 360 380 265"
        dur="0.9s" repeatCount="indefinite"/>
      <circle cx="380" cy="265" r="18" fill="#c9ccd1" stroke="#8b8f96" stroke-width="3"/>
      <line x1="380" y1="265" x2="405" y2="265" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <line x1="380" y1="265" x2="355" y2="265" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <rect x="396" y="261" width="18" height="8" rx="2" fill="#222"/>
      <rect x="346" y="261" width="18" height="8" rx="2" fill="#222"/>
      <circle cx="380" cy="265" r="4" fill="#333"/>
    </g>

    <!-- 近侧腿（亮橙色；IK 求解，脚严格跟随踏板圆周） -->
    <path d="M352,178 L393.3,214.3 L405,265" fill="none" stroke="#f5a623" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="M352,178 L393.3,214.3 L405.0,265.0;
                M352,178 L380.5,225.0 L397.7,282.7;
                M352,178 L372.3,229.1 L380.0,290.0;
                M352,178 L367.1,230.9 L362.3,282.7;
                M352,178 L384.6,222.3 L355.0,265.0;
                M352,178 L397.4,209.0 L362.3,247.3;
                M352,178 L404.6,194.2 L380.0,240.0;
                M352,178 L404.1,195.7 L397.7,247.3;
                M352,178 L393.3,214.3 L405.0,265.0"/>
    </path>

    <!-- 前轮 -->
    <g class="wheel-front">
      <animateTransform attributeName="transform" type="rotate"
        values="0 480 265; 360 480 265" dur="0.9s" repeatCount="indefinite"/>
      <circle cx="480" cy="265" r="55" fill="none" stroke="#222" stroke-width="8"/>
      <circle cx="480" cy="265" r="47" fill="none" stroke="#d7dbe0" stroke-width="2"/>
      <g stroke="#9aa0a8" stroke-width="3">
        <line x1="436" y1="265" x2="524" y2="265"/>
        <line x1="480" y1="221" x2="480" y2="309"/>
        <line x1="449" y1="234" x2="511" y2="296"/>
        <line x1="449" y1="296" x2="511" y2="234"/>
      </g>
      <circle cx="480" cy="265" r="7" fill="#555"/>
    </g>

    <!-- 车座 + 把手 -->
    <line x1="346" y1="182" x2="342" y2="170" stroke="#444" stroke-width="5"/>
    <path d="M320,170 Q342,160 364,170 L358,176 L326,176 Z" fill="#3a3a3a"/>
    <line x1="462" y1="168" x2="466" y2="152" stroke="#444" stroke-width="5"/>
    <path d="M466,152 Q482,148 488,158" fill="none" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>

    <!-- ============ 鹈鹕 ============ -->
    <g class="rider">
      <!-- 尾羽 -->
      <path d="M272,148 L228,128 L236,160 L224,166 L272,168 Z" fill="#dfe3e6"/>

      <!-- 身体 -->
      <ellipse cx="322" cy="148" rx="60" ry="40" fill="#f6f7f2" stroke="#c9cfd4" stroke-width="2"/>
      <path d="M290,168 Q330,186 372,164" fill="none" stroke="#d4dae0" stroke-width="2"/>

      <!-- 脖子 -->
      <path d="M352,132 Q398,104 428,96" fill="none" stroke="#f6f7f2" stroke-width="27" stroke-linecap="round"/>

      <!-- 头 + 大嘴 -->
      <g class="head">
        <circle cx="436" cy="90" r="21" fill="#f6f7f2" stroke="#c9cfd4" stroke-width="2"/>
        <!-- 喉囊 -->
        <path d="M452,100 Q470,136 540,106 L540,98 Q485,112 454,92 Z" fill="#e9a13b" stroke="#cf8626" stroke-width="2"/>
        <!-- 上喙 -->
        <path d="M452,86 L548,96 Q552,99 548,102 L452,97 Z" fill="#f2b134" stroke="#cf8626" stroke-width="1.5"/>
        <!-- 嘴缝 -->
        <line x1="452" y1="96" x2="545" y2="99" stroke="#a5691a" stroke-width="2"/>
        <!-- 眼睛 -->
        <circle cx="445" cy="84" r="4.5" fill="#1e1e1e"/>
        <circle cx="446.5" cy="82.5" r="1.6" fill="#fff"/>
        <!-- 头顶小冠羽 -->
        <path d="M428,72 Q420,58 432,62 Q426,70 434,74" fill="#dfe3e6"/>
      </g>

      <!-- 扇动的翅膀（远侧） -->
      <path class="wing" d="M296,120 Q340,108 356,142 Q334,172 292,156 Q282,138 296,120 Z"
            fill="#e2e6ea" stroke="#c1c8cf" stroke-width="2"/>
      <path d="M304,130 Q330,124 346,142 M300,142 Q326,140 340,152" fill="none" stroke="#c1c8cf" stroke-width="2" class="wing"/>

      <!-- 前翅当手臂，握住车把 -->
      <path d="M356,138 Q415,162 478,155" fill="none" stroke="#eceee9" stroke-width="16" stroke-linecap="round"/>
      <path d="M356,138 Q415,162 478,155" fill="none" stroke="#c9cfd4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <circle cx="479" cy="155" r="6" fill="#eceee9" stroke="#c9cfd4" stroke-width="1.5"/>
    </g>
  </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#5b7a99" stroke-width="4" stroke-linecap="round" fill="none">
    <g class="streak"><line x1="150" y1="150" x2="100" y2="150"/></g>
    <g class="streak s2"><line x1="130" y1="205" x2="80" y2="205"/></g>
    <g class="streak s3"><line x1="155" y1="250" x2="110" y2="250"/></g>
  </g>

  <!-- 标题 -->
  <text x="24" y="44" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#2b4a63" opacity="0.85">鹈鹕骑自行车 · Pelican on a Bicycle</text>
</svg>

</body>
</html>
