<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车</title>
<style>
html,body{margin:0;height:100%%;background:#0f172a;display:flex;align-items:center;justify-content:center}
svg{width:min(96vw,1000px);height:auto;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
@keyframes drift{from{transform:translateX(950px)}to{transform:translateX(-250px)}}
.cloud{animation:drift linear infinite}
.c1{animation-duration:26s;animation-delay:-8s}
.c2{animation-duration:34s;animation-delay:-20s}
.c3{animation-duration:44s;animation-delay:-33s}
@keyframes zip{from{transform:translateX(320px);opacity:0}10%%{opacity:.9}90%%{opacity:.9}to{transform:translateX(-40px);opacity:0}}
.sp{animation:zip .9s linear infinite}
.s2{animation-duration:1.1s;animation-delay:-.4s}
.s3{animation-duration:.8s;animation-delay:-.2s}
</style>
</head>
<body>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pelican riding a bicycle">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bde3ff"/><stop offset="1" stop-color="#eaf7ff"/>
  </linearGradient>
</defs>
<rect width="900" height="500" fill="url(#sky)"/>
<circle cx="790" cy="80" r="42" fill="#ffd75e"/>
<!-- clouds (CSS drift) -->
<g class="cloud c1"><ellipse cx="0" cy="70" rx="52" ry="18" fill="#ffffff"/><ellipse cx="30" cy="60" rx="34" ry="14" fill="#ffffff"/></g>
<g class="cloud c2"><ellipse cx="0" cy="130" rx="44" ry="15" fill="#ffffff"/><ellipse cx="-26" cy="122" rx="28" ry="12" fill="#ffffff"/></g>
<g class="cloud c3"><ellipse cx="0" cy="50" rx="38" ry="13" fill="#f4fbff"/><ellipse cx="22" cy="43" rx="24" ry="10" fill="#f4fbff"/></g>
<!-- speed lines -->
<g stroke="#9fc9e8" stroke-width="4" stroke-linecap="round">
  <line class="sp s1" x1="0" y1="240" x2="46" y2="240"/>
  <line class="sp s2" x1="0" y1="300" x2="34" y2="300"/>
  <line class="sp s3" x1="0" y1="360" x2="52" y2="360"/>
</g>
<!-- ground -->
<rect x="0" y="450" width="900" height="50" fill="#6fbf73"/>
<rect x="0" y="450" width="900" height="26" fill="#7a7f87"/>
<line x1="0" y1="463" x2="900" y2="463" stroke="#f3f4f6" stroke-width="5" stroke-dasharray="33 22">
  <animate attributeName="stroke-dashoffset" from="0" to="-550" dur="2.2509s" repeatCount="indefinite"/>
</line>

<!-- ===== far crank + pedal ===== -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="0 470 385;360 470 385" dur="1.80s" repeatCount="indefinite"/>
  <line x1="470" y1="385" x2="446" y2="385" stroke="#6b7280" stroke-width="7" stroke-linecap="round"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 446 385;-360 446 385" dur="1.80s" repeatCount="indefinite"/>
    <rect x="435" y="382" width="22" height="6" rx="2" fill="#374151"/>
  </g>
</g>
<!-- far leg -->
<path d="" stroke="#d97706" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <animate attributeName="d" values="M 438.0 268.0 L 490.9 321.2 L 446.0 385.0;M 438.0 268.0 L 498.4 312.5 L 449.2 373.0;M 438.0 268.0 L 504.9 301.9 L 458.0 364.2;M 438.0 268.0 L 508.6 293.2 L 470.0 361.0;M 438.0 268.0 L 509.3 291.2 L 482.0 364.2;M 438.0 268.0 L 507.3 296.8 L 490.8 373.0;M 438.0 268.0 L 501.8 307.4 L 494.0 385.0;M 438.0 268.0 L 493.0 319.0 L 490.8 397.0;M 438.0 268.0 L 483.3 327.8 L 482.0 405.8;M 438.0 268.0 L 478.0 331.4 L 470.0 409.0;M 438.0 268.0 L 479.1 330.7 L 458.0 405.8;M 438.0 268.0 L 484.0 327.2 L 449.2 397.0;M 438.0 268.0 L 490.9 321.2 L 446.0 385.0" dur="1.80s" calcMode="linear" repeatCount="indefinite"/>
</path>

<!-- ===== wheels ===== -->
<g stroke="#374151" fill="none">
  <circle cx="300" cy="380" r="70" stroke-width="8"/>
  <circle cx="620" cy="380" r="70" stroke-width="8"/>
</g>
<g stroke="#9ca3af" stroke-width="3">
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 300 380;360 300 380" dur="1.80s" repeatCount="indefinite"/>
    <line x1="300" y1="314" x2="300" y2="446"/>
    <line x1="234" y1="380" x2="366" y2="380"/>
    <line x1="250.5" y1="330.5" x2="349.5" y2="429.5"/>
    <line x1="250.5" y1="429.5" x2="349.5" y2="330.5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 620 380;360 620 380" dur="1.80s" repeatCount="indefinite"/>
    <line x1="620" y1="314" x2="620" y2="446"/>
    <line x1="554" y1="380" x2="686" y2="380"/>
    <line x1="570.5" y1="330.5" x2="669.5" y2="429.5"/>
    <line x1="570.5" y1="429.5" x2="669.5" y2="330.5"/>
  </g>
</g>
<circle cx="300" cy="380" r="6" fill="#4b5563"/>
<circle cx="620" cy="380" r="6" fill="#4b5563"/>

<!-- ===== frame ===== -->
<g stroke="#dc2626" stroke-width="8" stroke-linecap="round" fill="none">
  <line x1="300" y1="380" x2="470" y2="385"/>
  <line x1="300" y1="380" x2="436" y2="272"/>
  <line x1="470" y1="385" x2="435" y2="262"/>
  <line x1="470" y1="385" x2="598" y2="300"/>
  <line x1="435" y1="268" x2="592" y2="260"/>
  <line x1="592" y1="256" x2="600" y2="308"/>
  <line x1="600" y1="308" x2="620" y2="380"/>
</g>
<!-- seat -->
<path d="M 410 258 Q 435 248 462 256 Q 436 268 410 258 Z" fill="#1f2937"/>
<!-- stem + handlebar -->
<g stroke="#4b5563" stroke-width="7" stroke-linecap="round" fill="none">
  <line x1="592" y1="258" x2="612" y2="244"/>
  <line x1="612" y1="244" x2="600" y2="238"/>
</g>
<line x1="606" y1="241" x2="620" y2="249" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
<!-- chainring -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="0 470 385;360 470 385" dur="1.80s" repeatCount="indefinite"/>
  <circle cx="470" cy="385" r="16" fill="none" stroke="#374151" stroke-width="5"/>
  <line x1="470" y1="369" x2="470" y2="401" stroke="#374151" stroke-width="3"/>
  <line x1="454" y1="385" x2="486" y2="385" stroke="#374151" stroke-width="3"/>
</g>
<circle cx="470" cy="385" r="5" fill="#1f2937"/>

<!-- ===== near crank + pedal ===== -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="0 470 385;360 470 385" dur="1.80s" repeatCount="indefinite"/>
  <line x1="470" y1="385" x2="494" y2="385" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 494 385;-360 494 385" dur="1.80s" repeatCount="indefinite"/>
    <rect x="483" y="382" width="22" height="6" rx="2" fill="#111827"/>
  </g>
</g>
<!-- near leg -->
<path d="" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <animate attributeName="d" values="M 438.0 268.0 L 501.8 307.4 L 494.0 385.0;M 438.0 268.0 L 493.0 319.0 L 490.8 397.0;M 438.0 268.0 L 483.3 327.8 L 482.0 405.8;M 438.0 268.0 L 478.0 331.4 L 470.0 409.0;M 438.0 268.0 L 479.1 330.7 L 458.0 405.8;M 438.0 268.0 L 484.0 327.2 L 449.2 397.0;M 438.0 268.0 L 490.9 321.2 L 446.0 385.0;M 438.0 268.0 L 498.4 312.5 L 449.2 373.0;M 438.0 268.0 L 504.9 301.9 L 458.0 364.2;M 438.0 268.0 L 508.6 293.2 L 470.0 361.0;M 438.0 268.0 L 509.3 291.2 L 482.0 364.2;M 438.0 268.0 L 507.3 296.8 L 490.8 373.0;M 438.0 268.0 L 501.8 307.4 L 494.0 385.0" dur="1.80s" calcMode="linear" repeatCount="indefinite"/>
</path>

<!-- ===== pelican ===== -->
<!-- tail -->
<path d="M 400 210 Q 360 195 342 205 Q 366 214 372 222 Q 352 220 340 228 Q 372 240 402 234 Z" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2"/>
<!-- body -->
<ellipse cx="452" cy="222" rx="66" ry="46" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" transform="rotate(-12 452 222)"/>
<!-- neck -->
<path d="M 500 196 Q 548 152 578 150" stroke="#f9fafb" stroke-width="22" fill="none" stroke-linecap="round"/>
<path d="M 500 196 Q 548 152 578 150" stroke="#d1d5db" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
<!-- head -->
<circle cx="588" cy="150" r="17" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<circle cx="593" cy="145" r="2.8" fill="#111827"/>
<!-- beak: pouch first, then mandible on top -->
<path d="M 601 158 Q 636 192 672 170 L 672 160 Q 640 166 601 152 Z" fill="#fdba74" stroke="#ea9a55" stroke-width="1.5"/>
<path d="M 600 144 L 678 158 Q 682 161 678 164 L 600 158 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
<!-- wing reaching to grip -->
<path d="M 468 206 Q 528 186 582 218 Q 604 231 617 244 Q 606 254 594 248 Q 548 244 498 238 Q 474 230 468 206 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
<path d="M 500 232 Q 545 236 580 240" stroke="#9ca3af" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
</body>
</html>
